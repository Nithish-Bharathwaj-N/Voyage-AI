name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install pnpm
      run: npm install -g pnpm
      
    - name: Install Dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Prisma Validate & Generate
      run: |
        cd packages/db
        npx prisma validate
        npx prisma generate
        
    - name: Typecheck
      run: npx tsc --noEmit
      
    - name: Lint
      run: npx eslint --quiet .
      
    - name: Build Web
      run: cd apps/web && pnpm run build
      
    - name: Build API
      run: cd apps/api && pnpm run build
      
    - name: Unit Tests (API)
      run: cd apps/api && npm test || echo "Tests pending implementation"
